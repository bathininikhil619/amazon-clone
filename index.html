<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Clone</title>
  <link rel="stylesheet" href="styles/general.css">
  <link rel="stylesheet" href="styles/header.css">
</head>
<body>
  <!-- ===== Header ===== -->
  <header class="header">
    <a href="index.html" class="header-logo">
      amazon<span class="logo-dot">.clone</span>
    </a>

    <form class="search-bar">
      <input class="search-input" type="text" placeholder="Search products">
      <button class="search-button" type="submit" aria-label="Search">🔍</button>
    </form>

    <div class="header-right">
      <a href="#" class="header-link">
        <span class="header-link-small">Returns</span>
        <span class="header-link-big">&amp; Orders</span>
      </a>

      <a href="checkout.html" class="cart-link">
        <span class="cart-icon">🛒</span>
        <span class="cart-quantity">0</span>
        <span class="cart-text">Cart</span>
      </a>
    </div>
  </header>

  <!-- ===== Main content (products come in Step 2) ===== -->
  <main class="main">
    <h1>Welcome to Gaalis Amazon</h1>
    <p>Products will appear here soon.</p>
  </main>
</body>
</html>
