<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Clone</title>
  <link rel="stylesheet" href="styles/general.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/home.css">
</head>
<body>
  <!-- ===== Header ===== -->
  <header class="header">
    <a href="index.html" class="header-logo">
      amazon<span class="logo-dot">.clone</span>
    </a>

    <form class="search-bar">
      <input class="search-input" type="text" placeholder="Search products">
      <button class="search-button" type="submit" aria-label="Search">🔍</button>
    </form>

    <div class="header-right">
      <a href="#" class="header-link">
        <span class="header-link-small">Returns</span>
        <span class="header-link-big">&amp; Orders</span>
      </a>

      <a href="checkout.html" class="cart-link">
        <span class="cart-icon">🛒</span>
        <span class="cart-quantity">0</span>
        <span class="cart-text">Cart</span>
      </a>
    </div>
  </header>

  <!-- ===== Main content ===== -->
  <main class="main">
    <section class="category-grid">
      <div class="category-card">
        <a href="#" class="category-card-header">
          <h2 class="category-card-title">Shop fall arrivals</h2>
          <span class="category-card-arrow">&rsaquo;</span>
        </a>
        <div class="category-items">
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/dresses.jpg" alt="Dresses">
            <span class="category-item-label">Dresses</span>
          </a>
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/shoes.jpg" alt="Shoes">
            <span class="category-item-label">Shoes</span>
          </a>
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/handbags.jpg" alt="Handbags">
            <span class="category-item-label">Handbags</span>
          </a>
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/new-arrivals.jpg" alt="New Arrivals">
            <span class="category-item-label">New Arrivals</span>
          </a>
        </div>
      </div>

      <div class="category-card">
        <a href="#" class="category-card-header">
          <h2 class="category-card-title">Shop new arrivals</h2>
          <span class="category-card-arrow">&rsaquo;</span>
        </a>
        <div class="category-items">
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/footwear.jpg" alt="Footwear">
            <span class="category-item-label">Footwear</span>
          </a>
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/watches.jpg" alt="Watches">
            <span class="category-item-label">Watches</span>
          </a>
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/jewelry.jpg" alt="Jewelry">
            <span class="category-item-label">Jewelry</span>
          </a>
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/bags.jpg" alt="Bags">
            <span class="category-item-label">Bags</span>
          </a>
        </div>
      </div>

      <div class="category-card">
        <a href="#" class="category-card-header">
          <h2 class="category-card-title">Fall shoe checklist</h2>
          <span class="category-card-arrow">&rsaquo;</span>
        </a>
        <div class="category-items">
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/boots.jpg" alt="Boots">
            <span class="category-item-label">Boots</span>
          </a>
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/dress-shoes.jpg" alt="Dress shoes">
            <span class="category-item-label">Dress shoes</span>
          </a>
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/running-shoes.jpg" alt="Running shoes">
            <span class="category-item-label">Running shoes</span>
          </a>
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/casual-sneakers.jpg" alt="Casual sneakers">
            <span class="category-item-label">Casual sneakers</span>
          </a>
        </div>
      </div>

      <div class="category-card">
        <a href="#" class="category-card-header">
          <h2 class="category-card-title">Upgrade your decor</h2>
          <span class="category-card-arrow">&rsaquo;</span>
        </a>
        <div class="category-items">
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/candles.jpg" alt="Candles">
            <span class="category-item-label">Candles</span>
          </a>
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/furniture.jpg" alt="Furniture">
            <span class="category-item-label">Furniture</span>
          </a>
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/lighting.jpg" alt="Lighting">
            <span class="category-item-label">Lighting</span>
          </a>
          <a href="#" class="category-item">
            <img class="category-item-image" src="images/categories/wall-decor.jpg" alt="Wall decor">
            <span class="category-item-label">Wall decor</span>
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
